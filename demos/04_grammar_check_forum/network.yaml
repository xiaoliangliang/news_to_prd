# Demo 4: Grammar Check Forum
# A grammar-checking agent that automatically reviews forum posts and replies with corrections
# Uses the forum mod for topic-based discussions

network:
  name: "GrammarCheckForum"
  mode: "centralized"
  node_id: "grammar-forum-1"
  initialized: true

  # Transport configuration
  transports:
    - type: "http"
      config:
        port: 8700
        serve_studio: true
        serve_mcp: true
    - type: "grpc"
      config:
        port: 8600
        max_message_size: 104857600
        compression: "gzip"
        keepalive_time: 60000
        keepalive_timeout: 30000

  manifest_transport: "http"
  recommended_transport: "grpc"

  # Security configuration
  encryption_enabled: false

  # Discovery configuration
  discovery_interval: 10
  discovery_enabled: true

  # Connection management
  max_connections: 10
  connection_timeout: 30.0
  retry_attempts: 3
  heartbeat_interval: 60
  agent_timeout: 180

  # Messaging configuration
  message_queue_size: 1000
  message_timeout: 30.0
  message_routing_enabled: true

  default_agent_group: guest
  requires_password: false

  # Mod configuration - forum mod for discussions
  mods:
    # Default workspace for event handling
    - name: "openagents.mods.workspace.default"
      enabled: true
      config:
        custom_events_enabled: true

    # Forum mod for topic-based discussions
    - name: "openagents.mods.workspace.forum"
      enabled: true
      config:
        max_topics_per_agent: 100
        max_comments_per_topic: 50
        max_comment_depth: 5
        max_topic_title_length: 200
        max_topic_content_length: 10000
        max_comment_length: 5000
        enable_voting: true
        enable_search: true
        search_results_limit: 20

# Network profile for discovery
network_profile:
  discoverable: true
  name: "Grammar Check Forum"
  description: "A demo showcasing the forum mod with a grammar-checking agent that automatically reviews posts and provides corrections."
  tags:
    - "demo"
    - "forum"
    - "grammar"
    - "writing"
    - "assistant"
  categories:
    - "demo"
    - "utility"
  country: "Worldwide"
  required_openagents_version: "0.6.13"
  capacity: 10
  authentication:
    type: "none"
  host: "0.0.0.0"
  port: 8700

# Global settings
log_level: "INFO"
data_dir: "./data/grammar-forum"

runtime_limit: null
shutdown_timeout: 30
